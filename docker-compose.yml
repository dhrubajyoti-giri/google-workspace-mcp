services:
  google-workspace-mcp:
    build: .
    container_name: google-workspace-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    # All runtime config via env_file only (no environment: block)
    env_file:
      - .env
    volumes:
      # ── Secrets: Google OAuth credentials + token registry ──
      # Host path: point SECRETS_VOLUME_PATH in .env at your secrets directory.
      # Contents:
      #   client_secret.json  ← Google OAuth client credentials (from Google Cloud Console)
      #   registry.json       ← auto-generated (user tokens, per-user scopes)
      # These are NOT in the Docker image and NOT in git.
      - ${SECRETS_VOLUME_PATH:-/path/to/secrets}:/secrets:rw
    networks:
      - caddy   # HTTPS reverse proxy (Caddy terminates TLS)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${MCP_PORT:-8000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  caddy:
    external: true
