services:
  google-workspace-mcp:
    build: .
    container_name: google-workspace-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8000}:${MCP_PORT:-8000}"   # host:container — both use MCP_PORT for consistency
    env_file:
      - .env
    environment:
      # —— All runtime config is env-driven, no hardcoded values ——
      TZ: "${TZ:-Asia/Kolkata}"
      PYTHONPATH: /home/appuser/app

      # Server
      MCP_HOST: "${MCP_HOST:-0.0.0.0}"
      MCP_PORT: "${MCP_PORT:-8000}"    # dynamic port — set MCP_PORT in .env

      # External URL for OAuth callbacks (must match Caddy domain)
      EXTERNAL_URL: "${EXTERNAL_URL:-https://google-api.mcp.dg.linkpc.net}"

      # Google OAuth credential paths (point at mounted secrets volume)
      GOOGLE_CLIENT_SECRET_FILE: "${GOOGLE_CLIENT_SECRET_FILE:-/config/client_secret.json}"
      GOOGLE_TOKEN_FILE: "${GOOGLE_TOKEN_FILE:-/config/token.json}"
      GOOGLE_CREDENTIALS_DIR: "${GOOGLE_CREDENTIALS_DIR:-/config}"

      # Google API scopes (comma-separated, read+write)
      GOOGLE_SCOPES: "${GOOGLE_SCOPES}"
      GOOGLE_SCOPES_RAW: "${GOOGLE_SCOPES_RAW:-${GOOGLE_SCOPES}}"

      # MCP metadata
      MCP_SERVER_NAME: "${MCP_SERVER_NAME:-google-workspace-mcp}"
      MCP_SERVER_VERSION: "${MCP_SERVER_VERSION:-1.0.0}"

      # Logging
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"

      # Auth token — protects /mcp from unauthenticated access.
      # Must match AUTH_TOKEN in the MCP client's environment.
      AUTH_TOKEN: "${AUTH_TOKEN}"
    volumes:
      # ── Secrets: client_secret.json + token.json ──
      # Host path: point this at your secrets directory.
      # Contents:
      #   client_secret.json  ← Google OAuth client credentials (NOT in image)
      #   token.json          ← auto-generated refresh token (NOT in image, NOT in Git)
      - ${VOLUME_PATH}:/config:rw
    networks:
      - caddy   # for Caddy HTTPS proxy
      - mcp     # for QwenPaw MCP client access
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${MCP_PORT:-8000}/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  caddy:
    external: true
  mcp:
    external: true
